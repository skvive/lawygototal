name: LAWYGO original AI art optimized assets
on:
  pull_request:
    paths:
      - 'docs/design/LAWYGO_AI_ASSET_BLOBS_20261103.json'
      - 'scripts/build_lawygo_ai_assets.py'
      - '.github/workflows/lawygo-art-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check 'Pillow==11.3.0'
      - name: Generate optimized WebP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_lawygo_ai_assets.py
      - name: Commit compressed images to the reviewed branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img/design/lawygo-ai-20261103/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "art(lawygo): add six optimized service visuals"
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          fi
