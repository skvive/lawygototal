name: LAWYGO Total Android QA (non-production)
on:
  workflow_dispatch:
  push:
    branches:
      - qa/lawygo-accessibility-android-20261101
    paths:
      - android_native/**
      - .github/workflows/lawygo-native-qa.yml
  pull_request:
    paths:
      - android_native/**
      - .github/workflows/lawygo-native-qa.yml

permissions:
  contents: read

jobs:
  native-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate native source contracts (18 tests)
        working-directory: android_native/LAWYGO_ANDROID_NATIVE_20261031
        run: python -m unittest discover -s qa -p test_native_project_contract.py -v

  android-debug:
    needs: native-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android_native/LAWYGO_ANDROID_NATIVE_20261031
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 / SDK 36 (runner SDK)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Android compilation and JVM unit tests
        run: gradle --no-daemon --stacktrace :app:testSuiteDebugUnitTest :app:assembleSuiteDebug
      - name: Upload suite debug APK (unsigned for release)
        uses: actions/upload-artifact@v4
        with:
          name: lawygo-total-suite-debug-apk
          path: android_native/LAWYGO_ANDROID_NATIVE_20261031/app/build/outputs/apk/suite/debug/*.apk
          if-no-files-found: error

  android-emulator-smoke:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 36 build SDK
        run: |
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build suite debug for emulator
        working-directory: android_native/LAWYGO_ANDROID_NATIVE_20261031
        run: gradle --no-daemon :app:assembleSuiteDebug
      - name: Boot Android emulator and check first launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -e
            adb install android_native/LAWYGO_ANDROID_NATIVE_20261031/app/build/outputs/apk/suite/debug/app-suite-debug.apk
            adb shell monkey -p site.lexid.lawygo 1
            sleep 10
            adb shell dumpsys activity activities | grep -i 'site.lexid.lawygo'
            adb exec-out screencap -p > lawygo-emulator-first-launch.png
      - name: Export first-launch screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lawygo-android-emulator-first-launch
          path: lawygo-emulator-first-launch.png
          if-no-files-found: warn
