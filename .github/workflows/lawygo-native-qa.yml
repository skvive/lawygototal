name: LAWYGO Total Android QA (non-production)
on:
  workflow_dispatch:
  push:
    branches:
      - qa/lawygo-accessibility-android-20261101
      - qa/lawygo-emulator-kvm-20261102
    paths:
      - android_native/**
      - .github/workflows/lawygo-native-qa.yml
  pull_request:
    paths:
      - android_native/**
      - .github/workflows/lawygo-native-qa.yml

permissions:
  contents: read

jobs:
  native-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate native source contracts (18 tests)
        working-directory: android_native/LAWYGO_ANDROID_NATIVE_20261031
        run: python -m unittest discover -s qa -p test_native_project_contract.py -v

  android-debug:
    needs: native-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android_native/LAWYGO_ANDROID_NATIVE_20261031
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android 16 / SDK 36 (runner SDK)
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Android compilation and JVM unit tests
        run: gradle --no-daemon --stacktrace :app:testSuiteDebugUnitTest :app:assembleSuiteDebug
      - name: Upload suite debug APK (unsigned for release)
        uses: actions/upload-artifact@v4
        with:
          name: lawygo-total-suite-debug-apk
          path: android_native/LAWYGO_ANDROID_NATIVE_20261031/app/build/outputs/apk/suite/debug/*.apk
          if-no-files-found: error

  android-emulator-smoke:
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Reuse the exact APK built in android-debug
        uses: actions/download-artifact@v4
        with:
          name: lawygo-total-suite-debug-apk
          path: android_native/LAWYGO_ANDROID_NATIVE_20261031/app/build/outputs/apk/suite/debug
      - name: Verify APK exists before starting the emulator
        run: |
          APK=android_native/LAWYGO_ANDROID_NATIVE_20261031/app/build/outputs/apk/suite/debug/app-suite-debug.apk
          ls -lh "$APK"
          test -s "$APK"
      - name: Enable KVM hardware acceleration for emulator
        run: |
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "KVM device is unavailable on this GitHub runner; emulator cannot meet this QA gate"
            exit 1
          fi
      - name: Boot Android emulator, install and launch Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 2
          emulator-boot-timeout: 600
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -eu
            APK=android_native/LAWYGO_ANDROID_NATIVE_20261031/app/build/outputs/apk/suite/debug/app-suite-debug.apk
            adb wait-for-device
            adb devices -l
            adb shell getprop sys.boot_completed
            adb install -r "$APK"
            echo "--- Diagnostics: installed packages ---"
            adb shell pm list packages | grep -i lawygo || true
            adb shell pm path site.lexid.lawygo || true
            echo "--- Launch LAWYGO explicitly (never mask launch failure) ---"
            adb shell am force-stop site.lexid.lawygo || true
            adb shell am start -W -n site.lexid.lawygo/.MainActivity > lawygo-emulator-launch.txt 2>&1 || true
            cat lawygo-emulator-launch.txt
            sleep 10
            echo "--- Capture evidence before checking success ---"
            adb exec-out screencap -p > lawygo-emulator-first-launch.png || true
            adb logcat -d -v brief -t 3000 > lawygo-emulator-logcat.txt || true
            adb shell dumpsys activity activities > lawygo-emulator-activity.txt || true
            test -s lawygo-emulator-first-launch.png
            APP_PID=$(adb shell pidof site.lexid.lawygo | tr -d '\r' || true)
            echo "LAWYGO app PID: $APP_PID"
            test -n "$APP_PID"
            grep -q site.lexid.lawygo lawygo-emulator-activity.txt
      - name: Export emulator evidence (screenshot, activity, logcat)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lawygo-android-emulator-evidence
          path: |
            lawygo-emulator-first-launch.png
            lawygo-emulator-logcat.txt
            lawygo-emulator-activity.txt
            lawygo-emulator-launch.txt
          if-no-files-found: warn
