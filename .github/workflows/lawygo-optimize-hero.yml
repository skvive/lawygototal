name: LAWYGO image optimization (QA branch only)
on:
  push:
    branches: [fix/lawygo-live-mobile-speed-20261102]
    paths: [.github/workflows/lawygo-optimize-hero.yml]
permissions:
  contents: write
jobs:
  generate-webp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "Pillow>=11,<13"
      - name: Optimize approved repository source photos (no remote imagery)
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          mapping = {
            "static/img/journal/hero-markets.jpg": ("static/img/design/hero-sunset-20261102.webp", 1120, 67),
            "static/img/journal/hero-korea.jpg": ("static/img/design/hero-seoul-20261102.webp", 1120, 68),
            "static/img/editorial/journal-lead.jpg": ("static/img/design/editorial-library-20261102.webp", 1000, 70),
            "static/img/editorial/pan-blog-1.png": ("static/img/design/pan-blog-20261102.webp", 900, 68),
          }
          for src, (dest, width, quality) in mapping.items():
            p=Path(src)
            img=Image.open(p).convert('RGB')
            img.thumbnail((width,900))
            out=Path(dest)
            out.parent.mkdir(parents=True,exist_ok=True)
            img.save(out,format='WEBP',quality=quality,method=6)
            print(f'{src} {p.stat().st_size}B -> {dest} {out.stat().st_size}B',flush=True)
          PY
      - name: Commit optimized assets to protected QA branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/img/design/*-20261102.webp
          git diff --cached --quiet && exit 0
          git commit -m "perf: optimize LAWYGO hero and editorial imagery as WebP"
          git push origin HEAD:fix/lawygo-live-mobile-speed-20261102
