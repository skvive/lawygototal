name: LAWYGO brand and PAN discovery QA
on:
  pull_request:
    paths:
      - 'static/**'
      - 'pan_public_feed.py'
      - 'pan_discovery_v2.py'
      - 'tests/test_brand_pan_discovery.py'
      - '.github/workflows/lawygo-brand-pan-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install application and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile API modules and run isolated contracts
        run: |
          python -m py_compile pan_public_feed.py pan_discovery_v2.py app.py
          python -m pytest tests/test_brand_pan_discovery.py tests/test_pan_feed.py tests/test_portal_ui_contract.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public PAN JavaScript
        run: node --check static/pan-platform.js
