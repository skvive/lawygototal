name: LAWYGO newsletter queue validation
on:
  pull_request:
    paths:
      - 'newsletter_v3.py'
      - 'newsletter_queue_v4.py'
      - 'growth_v3.py'
      - 'tests/test_newsletter_v3.py'
      - 'static/newsletter-admin.*'
      - 'static/journal-newsletter.css'
      - 'static/journal.html'
      - '.github/workflows/newsletter-queue-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  newsletter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Compile newsletter Python sources
        run: |
          python -m py_compile app.py growth_v3.py newsletter_v3.py newsletter_queue_v4.py tests/test_newsletter_v3.py
      - name: Run isolated SQLite + fake SMTP tests
        env:
          LAWYGO_NEWSLETTER_ALLOW_SEND: 'false'
          LAWYGO_DB_PATH: /tmp/lawygo-newsletter-ci.db
          LAWYGO_UPLOAD_PATH: /tmp/lawygo-newsletter-ci-files
        run: python -m pytest tests/test_newsletter_v3.py -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check subscriber admin JavaScript syntax
        run: node --check static/newsletter-admin.js
