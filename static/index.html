<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="LAWYGO JOURNAL — 미국·한국 경제·법률 인터넷 신문">
  <title>LAWYGO JOURNAL</title>
  <link rel="icon" href="/static/favicon.ico">
  <link rel="stylesheet" href="/static/wsj.css">
</head>
<body class="wsj-body">
  <div data-lawygo-nav></div>
  <div class="wsj-edition-bar"><div class="wsj-wrap wsj-edition-inner">
    <span><strong>Digital Edition</strong> · WSJ-inspired layout</span>
    <a href="/journal">전체 저널면 →</a>
  </div></div>
  <main class="journal-shell"><div class="wsj-wrap">
    <div class="journal-lead-block">
      <div class="journal-kicker">FRONT PAGE</div>
      <h1>경제를 읽는 법률,<br>제도를 해석하는 저널.</h1>
      <p>연합뉴스·한국경제·BBC·NPR 등 RSS 헤드라인과 LAWYGO 편집 콘텐츠를 한 편집면에 배치합니다.</p>
      <a class="wsj-btn wsj-btn-admin" href="/journal" style="display:inline-flex;margin-top:16px">오늘의 저널 읽기</a>
    </div>
    <div id="home-journal-preview" class="journal-columns"></div>
  </div></main>
  <section class="journal-shell" id="newsletter" style="background:var(--wsj-cream);padding-top:40px">
    <div class="wsj-wrap">
      <h2 class="journal-section-title">NEWSLETTER</h2>
      <p>월 2회 무료 뉴스레터 — <a href="/journal">저널</a>과 동일 편집 기준.</p>
      <form id="newsletterSignup" style="max-width:480px;margin-top:16px;display:grid;gap:10px">
        <input type="email" id="newsletterEmail" required placeholder="email@example.com" style="padding:12px;border:1px solid #ccc">
        <label><input type="checkbox" id="newsletterConsent" required> 수신 동의</label>
        <button type="submit" class="wsj-btn wsj-btn-admin">구독</button>
        <p id="newsletterResult"></p>
      </form>
    </div>
  </section>
  <footer class="wsj-footer"><div class="wsj-wrap">© 2026 LAWYGO · Neon CMS · <a href="/dashboard">관리자 로그인</a></div></footer>
  <script src="/static/site-nav.js"></script>
  <script src="/static/marketing.js" defer></script>
  <script defer>
    fetch('/api/journal/feed').then(r=>r.json()).then(d=>{
      const root=document.getElementById('home-journal-preview');
      if(!root)return;
      const mk=(title,items)=>{const c=document.createElement('div');c.innerHTML='<h2 class="journal-section-title">'+title+'</h2>';items.slice(0,4).forEach(it=>{const s=document.createElement('a');s.className='journal-story';s.href='/journal';s.innerHTML='<h3>'+it.title+'</h3><p class="src">'+it.source+'</p>';c.append(s)});return c};
      root.append(mk('U.S.',d.us||[]),mk('KOREA',d.kr||[]));
    });
  </script>
</body>
</html>
