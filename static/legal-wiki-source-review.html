<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LAWYGO | 공식 원문 검수</title><style>body{font:16px system-ui,sans-serif;color:#172436;background:#f5f7fa;margin:0}main{max-width:880px;padding:20px;margin:auto}section{background:white;border:1px solid #dbe3ed;border-radius:10px;padding:18px;margin:12px 0}button,input,textarea{font:inherit;padding:10px;box-sizing:border-box;max-width:100%}button{background:#183b65;color:white;border:0;border-radius:6px;min-height:44px}button:disabled{opacity:.5}textarea{width:100%;min-height:100px}pre,li,p{white-space:pre-wrap;overflow-wrap:anywhere}label{display:block;margin:12px 0}a{color:#244c83}</style></head><body><main><a href="/static/legal-wiki-review.html">← 변호사 검수실</a><h1>공식 원문 검수</h1><p><a href="/static/legal-wiki-reference-mapping.html">법제처 참조 식별자 매핑 →</a></p><p>운영 조직의 승인된 관리자 변호사 전용. 공식 원문을 직접 확인하세요. 원문 검수는 법령 적용 여부나 위키 문서 발행을 승인하는 행위가 아닙니다.</p><p id="status" role="status" aria-live="polite"></p><section><button id="load">대기 목록 조회</button><ul id="queue"></ul></section><section id="detail" hidden><h2 id="title"></h2><p id="meta"></p><a id="original" target="_blank" rel="noopener noreferrer">공식 출처에서 원문 대조 ↗</a><pre id="body"></pre><form id="review"><label>검수 근거 및 확인 범위<textarea id="notes" minlength="10" maxlength="2000" required></textarea></label><label><input type="checkbox" id="confirm" required> 실제 공식 원문, 식별자, 시행일·선고일과 내용 일치를 확인했습니다.</label><button id="approve" disabled>원문 검증 등록</button></form></section></main><script src="/static/legal-wiki-source-review.js" defer></script></body></html>
