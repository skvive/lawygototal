<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>LAWYGO | 변호사 검수실</title><style>body{font:16px system-ui,sans-serif;color:#172436;background:#f5f7fa;margin:0}main{max-width:960px;padding:24px;margin:auto}section{background:white;border:1px solid #dbe3ed;border-radius:10px;padding:18px;margin:12px 0}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #bac7d5;border-radius:6px}button{background:#183b65;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}label{display:block;margin:8px 0}textarea{width:95%;min-height:80px}pre{white-space:pre-wrap;overflow-wrap:anywhere}li{margin:8px 0}#notice{min-height:24px}</style></head><body><main><a href="/static/legal-wiki-pro.html">← 전문 법률위키</a><h1>변호사 검수실</h1><p>승인된 변호사 계정 전용. 공식 출처와 적용 시점, 문서 내용을 직접 확인하세요.</p><p id="notice" role="status" aria-live="polite"></p><section><h2>검수 대상</h2><button id="load">검수 대기 목록 조회</button><label>리비전 ID <input id="rid" type="number" min="1"></label><button id="open">문서 열기</button><ul id="queue"></ul></section><section id="detail" hidden><h2 id="title"></h2><p id="meta"></p><pre id="body"></pre><h3>출처 후보</h3><ul id="candidates"></ul><h3>등록된 인용</h3><ul id="citations"></ul><h3>공식 원문 검색</h3><label>검색어 <input id="sourceq" maxlength="100"></label><button id="find">검색</button><div id="sources"></div><h3>인용 검증</h3><form id="citation"><label>출처 유형 <select id="kind"><option value="article">법령 조문</option><option value="precedent">판례</option></select></label><label>공식 자료 ID <input id="sid" type="number" min="1" required></label><label>출처 후보 ID (해당 시) <input id="cid" type="number" min="1"></label><label>검토한 주장 식별자 <input id="prop" maxlength="150" required></label><label>원문에서 직접 확인한 인용문 <textarea id="quote" minlength="8" maxlength="1500" required></textarea></label><label>관련성 <select id="relation"><option value="supports">지지</option><option value="contradicts">반대</option><option value="limits">제한</option><option value="context">맥락</option></select></label><label><input type="checkbox" id="confirm" required> 원문 및 주장 관련성을 직접 확인했습니다.</label><button>인용 검증 등록</button></form><h3>검수 결정</h3><label><input type="checkbox" id="reviewed"> 전체 문서와 출처 및 적용일을 검토했습니다.</label><button id="approve">승인 및 발행</button> <button id="revise">수정 요청</button> <button id="reject">반려</button></section></main><script src="/static/legal-wiki-review.js" defer></script></body></html>
