name: LAWYGO Android Native CI
on:
  workflow_dispatch:
  push:
    branches: [main, android-native]
    paths: ['app/**', '*.gradle.kts', 'gradle/**', '.github/workflows/android-native-build.yml']
  pull_request:
    paths: ['app/**', '*.gradle.kts', 'gradle/**']
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Build native debug APK and release AAB
        run: gradle --no-daemon :app:testSuiteDebugUnitTest :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: lawygo-android-debug-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: lawygo-android-unsigned-aab
          path: app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
