name: LAWYGO Google Play Internal Test (manual)
on:
  workflow_dispatch:
jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Decode upload signing key
        env:
          UPLOAD_KEY_BASE64: ${{ secrets.LAWYGO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          test -n "$UPLOAD_KEY_BASE64" || { echo 'Missing upload key secret'; exit 1; }
          printf '%s' "$UPLOAD_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/lawygo-upload.jks"
      - name: Build signed suite release AAB
        env:
          LAWYGO_UPLOAD_KEYSTORE: ${{ runner.temp }}/lawygo-upload.jks
          LAWYGO_UPLOAD_STORE_PASSWORD: ${{ secrets.LAWYGO_UPLOAD_STORE_PASSWORD }}
          LAWYGO_UPLOAD_KEY_ALIAS: ${{ secrets.LAWYGO_UPLOAD_KEY_ALIAS }}
          LAWYGO_UPLOAD_KEY_PASSWORD: ${{ secrets.LAWYGO_UPLOAD_KEY_PASSWORD }}
        run: gradle --no-daemon :app:bundleSuiteRelease
      - name: Upload AAB to internal test track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.LAWYGO_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: site.lexid.lawygo
          releaseFiles: app/build/outputs/bundle/suiteRelease/*.aab
          track: internal
          status: draft
